services:
  redis:
    image: "redis:alpine"
    container_name: geopv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: geopv-backend
    volumes:
      - ./Backend:/app
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - YOLO_CONFIG_DIR=/app/.config/ultralytics
    depends_on:
      - redis
    command: gunicorn app:app -b 0.0.0.0:5000 --workers 4
    restart: unless-stopped

  worker:
    build: ./Backend
    container_name: geopv-worker
    volumes:
      - ./Backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: python worker.py
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: geopv-frontend
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: geopv-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - ./Frontend/dist:/usr/share/nginx/html:ro  
    depends_on:
      - backend  
    restart: unless-stopped

volumes:
  redis-data:
